name: Update submodules

on:
  repository_dispatch:
    types: [submodule-push]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WorkHub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update submodule pointers and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMODULE_READ_TOKEN: ${{ secrets.WORKHUB_SUBMODULE_READ_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/update-submodules.sh
